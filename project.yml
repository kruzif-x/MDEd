name: MDEd
options:
  bundleIdPrefix: com.mded
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "5"
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic

packages:
  MDEdCore:
    path: Core

targets:
  MDEd:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "Resources/LivePreviewRender/**"
          - "Resources/Help.md"
          - "Resources/Acknowledgements.md"
      - path: App/Resources/LivePreviewRender
        type: folder
        buildPhase: resources
      - path: App/Resources/Help.md
        buildPhase: resources
      - path: App/Resources/Acknowledgements.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: MDEd
        PRODUCT_BUNDLE_IDENTIFIER: com.mded.MDEd
        PRODUCT_MODULE_NAME: MDEd
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: MDEdCore
        product: MDEdCore
      - sdk: FoundationModels.framework
